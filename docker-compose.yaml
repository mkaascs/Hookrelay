services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
  hookrelay:
    build: .
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: ${CONFIG_PATH}
      API_KEY: ${API_KEY}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: [ "CMD", "/bin/promtool", "check", "ready" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
  grafana:
    image: grafana/grafana:13.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-tempo.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  tempo_data:
